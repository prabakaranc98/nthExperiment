[project]
name = "nthexperiment"
version = "0.1.0"
description = "Personal learning experiments — frontier AI curriculum"
requires-python = ">=3.11"

dependencies = [
    # Core scientific stack
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "einops>=0.7",

    # Notebooks
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",

    # Utilities
    "tqdm>=4.66",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "typer>=0.9",
    "pydantic>=2.6",
]

[project.optional-dependencies]

# PyTorch — CPU default, override with cuda/mps extras
torch = [
    "torch>=2.3",
    "torchvision>=0.18",
    "torchaudio>=2.3",
]

# JAX — CPU default, install jax[cuda12] separately for GPU
jax = [
    "jax>=0.4.25",
    "jaxlib>=0.4.25",
    "flax>=0.8",
    "optax>=0.2",
    "orbax-checkpoint>=0.5",
]

# MLX — Apple Silicon
mlx = [
    "mlx>=0.12",
    "mlx-lm>=0.12",
]

# HuggingFace ecosystem
hf = [
    "transformers>=4.40",
    "datasets>=2.19",
    "tokenizers>=0.19",
    "accelerate>=0.29",
    "peft>=0.10",
    "trl>=0.8",
    "huggingface-hub>=0.22",
]

# Experiment tracking and logging
tracking = [
    "wandb>=0.16",
    "tensorboard>=2.16",
]

# Causal inference
causal = [
    "dowhy>=0.11",
    "econml>=0.15",
    "causalml>=0.15",
    "statsmodels>=0.14",
]

# Systems / profiling
systems = [
    "triton>=2.3",
    "nvitop>=1.3",
    "py-spy>=0.3",
    "memory-profiler>=0.61",
]

# Everything
all = [
    "nthexperiment[torch,jax,hf,tracking,causal,systems]",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "black>=24.4",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
]

[tool.uv.sources]
# Override for CUDA: uv pip install torch --index-url https://download.pytorch.org/whl/cu121

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
